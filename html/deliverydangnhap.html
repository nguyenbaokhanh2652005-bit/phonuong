<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | Phố Nướng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/deliverydangky.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="icon" href="../logotron.ico">
    <!-- dùng chung style -->
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <a class="brand" href="../index.html">PHỐ NƯỚNG</a>

            <div class="header__right">
                <div class="hotline">
                    <img src="../img/logo tròn.png" alt="Hotline" class="hotline__icon">
                    <div>Đường dây nóng: <a href="tel:19006043">19006043</a></div>

                </div>
            </div>
    </header>

    <!-- LOGIN -->
    <main class="auth-page">
        <section class="auth-card">
            <h1 class="auth-title">Đăng nhập</h1>

            <form class="auth-form" id="loginForm" novalidate>

                <!-- Email -->
                <div class="field">
                    <input type="email" id="email" placeholder="* Địa chỉ email">
                    <span class="error" id="emailError"></span>
                </div>

                <!-- Password -->
                <div class="field">
                    <input type="password" id="password" placeholder="* Mật khẩu">
                    <span class="error" id="passwordError"></span>
                </div>

                <!-- Error chung -->
                <div class="error" id="loginError" style="text-align:center;"></div>

                <!-- Button -->
                <button class="auth-submit is-active" type="submit">
          Đăng nhập
        </button>

                <div class="auth-bottom">
                    Chưa có tài khoản?
                    <a href="./deliverydangky.html">Đăng ký</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../js/deliverydangnhap.js"></script>
</body>

</html>
